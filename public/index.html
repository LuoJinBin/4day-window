<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广州 · 四天晴好窗口监测（阴天可放宽）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316636F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E3A63B'/%3E%3Cpath d='M2 26h28' stroke='%23F1F4F1' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js';"></script>
<link rel="stylesheet" href="./assets/app.css">

</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="brand">广州 <span>/</span> 四天窗口监测</div>
    <div class="mast-meta">广州中心城区 · 每天打开自动更新，直接给出发日期</div>
  </div>
</header>


<section class="simple">
  <div class="wrap">
    <p class="s-kicker">广州 · 四天三晚</p>
    <div class="s-head">
      <div>
        <h1 class="s-range" id="sRange">—</h1>
        <p class="s-sub" id="sSub">—</p>
      </div>
      <div class="s-verdict" id="sVerdict"></div>
    </div>
    <p class="s-why" id="sWhy"></p>
    <div class="s-days" id="sDays"></div>
    <div class="s-alt" id="sAlt"></div>
    <div class="s-foot">
      <span class="s-stamp" id="sUpdated">—</span>
      <button type="button" class="s-btn" id="btnEvidence" aria-expanded="false">查看数据依据</button>
    </div>
  </div>
</section>

<div class="evidence" id="evidence" hidden>
  <div class="wrap evidence-actions">
    <div class="evidence-status">
      <span class="dot" id="dot"></span>
      <span id="status">正在读取…</span>
    </div>
    <button id="btnRecalc" type="button">立即重算</button>
  </div>
  <div class="wrap evidence-sections">
    <section class="sheet" id="evidence-daily">
      <div class="rail">
        <h2>逐日预报</h2>
      </div>
      <div class="body">
        <div class="calwrap">
          <div class="calinner">
            <div class="cal" id="cal"></div>
          </div>
        </div>
        <div class="panel" id="panel" hidden></div>
        <p class="calhint">左右滑动查看日期</p>
      </div>
    </section>
    <section class="sheet" id="evidence-trend">
      <div class="rail">
        <h2>温度与降雨趋势</h2>
      </div>
      <div class="body">
        <div class="chart" id="trendchart"></div>
      </div>
    </section>
  </div>
</div>

<script src="./assets/snapshot-data.js"></script>

<script>window.GZ_API_BASE = '/api/forecast';</script>
<script src="./assets/app-core.js"></script>
<script src="./assets/app-backtest.js"></script>
<script src="./assets/app-charts.js"></script>
<script src="./assets/app-runtime.js"></script>

</body>
</html>
