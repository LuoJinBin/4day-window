<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="切换国内外城市，按出行日期、天数和具体时段查看天气，灵活安排出行。">
<meta name="theme-color" content="#16636F">
<title>城市天气 · 灵活出行计划</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316636F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E3A63B'/%3E%3Cpath d='M2 26h28' stroke='%23F1F4F1' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="./assets/app.css">

</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="brand">天气 <span>/</span> 灵活出行计划</div>
    <div class="mast-meta" id="mastMeta">切换城市、选择日期和时段，按你的计划查看天气</div>
  </div>
</header>

<section class="planner" id="planner" aria-label="出行计划设置">
  <div class="wrap">
    <div class="planner-heading">
      <div><span class="planner-kicker">YOUR TRIP, YOUR TIME</span><h2>按你的计划来查</h2></div>
      <p>城市、日期、天数和每天的时段都能自己选</p>
    </div>
    <div class="planner-grid">
      <div class="planner-field city-field">
        <label for="cityQuery">目的地城市</label>
        <div class="city-search">
          <input id="cityQuery" type="search" value="广州" placeholder="输入城市名，例如：成都、东京" autocomplete="off" maxlength="80">
          <button type="button" id="btnCitySearch">搜索</button>
        </div>
        <div class="city-current" id="cityCurrent" aria-live="polite">当前：广州 · 广东省 · 中国</div>
        <div class="city-results" id="cityResults" role="listbox" aria-label="城市搜索结果" hidden></div>
        <div class="city-quick" id="cityQuick" aria-label="常用城市">
          <span>常用：</span>
          <button type="button" data-city-query="深圳">深圳</button>
          <button type="button" data-city-query="北京">北京</button>
          <button type="button" data-city-query="上海">上海</button>
          <button type="button" data-city-query="杭州">杭州</button>
          <button type="button" data-city-query="成都">成都</button>
          <button type="button" data-city-query="厦门">厦门</button>
        </div>
      </div>
      <div class="planner-field mode-field">
        <label>日期怎么选</label>
        <div class="planner-mode" role="group" aria-label="日期选择方式">
          <button type="button" class="on" data-plan-mode="auto" aria-pressed="true">帮我找合适日期</button>
          <button type="button" data-plan-mode="fixed" aria-pressed="false">我已定好日期</button>
        </div>
      </div>
      <div class="planner-field">
        <label id="planStartLabel" for="planStart">最早出发日</label>
        <input id="planStart" type="date">
      </div>
      <div class="planner-field">
        <label id="planEndLabel" for="planEnd">最晚出发日</label>
        <input id="planEnd" type="date">
      </div>
      <div class="planner-field" id="durationField">
        <label for="planDuration">计划玩几天</label>
        <select id="planDuration">
          <option value="1">1 天</option><option value="2">2 天</option><option value="3">3 天</option>
          <option value="4" selected>4 天 3 晚</option><option value="5">5 天 4 晚</option>
          <option value="6">6 天 5 晚</option><option value="7">7 天 6 晚</option>
        </select>
      </div>
      <div class="planner-field period-field">
        <label for="planPeriod">每天想看哪个时段</label>
        <select id="planPeriod">
          <option value="all">全天</option>
          <option value="morning">早上 · 06:00–12:00</option>
          <option value="afternoon">下午 · 12:00–18:00</option>
          <option value="evening">晚上 · 18:00–24:00</option>
          <option value="custom">自选具体时间</option>
        </select>
        <div class="custom-times" id="customTimeFields" hidden>
          <label for="planFrom">从</label><input id="planFrom" type="time" value="09:00">
          <label for="planTo">到</label><input id="planTo" type="time" value="18:00">
        </div>
      </div>
      <div class="planner-actions">
        <button type="button" id="btnApplyPlan" class="apply-plan">按这个计划查</button>
        <button type="button" id="btnResetPlan" class="reset-plan">恢复默认</button>
      </div>
    </div>
    <p class="planner-hint" id="plannerHint" role="status" aria-live="polite">搜索城市后选择对应地区；预报日期以目的地当地时间为准。</p>
  </div>
</section>

<section class="simple">
  <div class="wrap">
    <p class="s-kicker" id="sKicker">广州 · 出行天气</p>
    <div class="s-head">
      <div>
        <h1 class="s-range" id="sRange">—</h1>
        <p class="s-sub" id="sSub">—</p>
      </div>
      <div class="s-verdict" id="sVerdict"></div>
    </div>
    <p class="s-why" id="sWhy"></p>
    <div class="s-days" id="sDays"></div>
    <div class="s-alt" id="sAlt"></div>
    <div class="s-foot">
      <span class="s-stamp" id="sUpdated" aria-live="polite">—</span>
      <button type="button" class="s-btn" id="btnEvidence" aria-expanded="false" aria-controls="evidence">查看数据依据</button>
    </div>
  </div>
</section>

<div class="evidence" id="evidence" hidden>
  <div class="wrap evidence-actions">
    <div class="evidence-status">
      <span class="dot" id="dot"></span>
      <span id="status" role="status" aria-live="polite" aria-atomic="true">正在读取…</span>
    </div>
    <button id="btnRecalc" type="button">立即重算</button>
  </div>
  <div class="wrap evidence-sections">
    <section class="sheet" id="evidence-daily">
      <div class="rail">
        <h2>逐日预报</h2>
      </div>
      <div class="body">
        <div class="calwrap">
          <div class="calinner">
            <div class="cal" id="cal"></div>
          </div>
        </div>
        <div class="panel" id="panel" role="region" aria-label="所选日期天气详情" aria-live="polite" hidden></div>
      </div>
    </section>
    <section class="sheet" id="evidence-trend">
      <div class="rail">
        <h2>温度与降雨趋势</h2>
      </div>
      <div class="body">
        <div class="chart" id="trendchart"></div>
      </div>
    </section>
  </div>
</div>

<script src="./assets/snapshot-data.js"></script>

<script>window.GZ_API_BASE = '/api/forecast';</script>
<script src="./assets/app-core.js"></script>
<script src="./assets/app-backtest.js"></script>
<script src="./assets/app-charts.js"></script>
<script src="./assets/app-runtime.js"></script>

</body>
</html>
